name: Market Database Read-only Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install audit dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "requests>=2.32.5,<3.0.0" \
            "pytz>=2025.2,<2026.0" \
            "feedparser>=6.0.0,<7.0.0" \
            "openpyxl>=3.1.5,<4.0.0" \
            "boto3>=1.35.0,<2.0.0"

      - name: Run remote read-only market database audit
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: |
          python -X utf8 scripts/market_data/audit_remote_security_master.py \
            --remote \
            --report "$RUNNER_TEMP/market-database-audit.json"

      - name: Upload JSON audit report only
        uses: actions/upload-artifact@v4
        with:
          name: market-database-readonly-audit
          path: ${{ runner.temp }}/market-database-audit.json
          if-no-files-found: error
          retention-days: 14
