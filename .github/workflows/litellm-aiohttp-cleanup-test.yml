name: LiteLLM Aiohttp Session Cleanup Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aiohttp-cleanup-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Verify LiteLLM version
        run: |
          python -c "import importlib.metadata as m; print('litellm_version=', m.version('litellm'))"
          python -c "import importlib.metadata as m; assert m.version('litellm') == '1.92.0'"

      - name: Run aiohttp session cleanup test
        run: |
          python -X utf8 scripts/diagnostics/test_litellm_aiohttp_session_cleanup.py
