# 本工作流仅在用户手动触发时抽样访问东方财富公开行情接口，不参与日常采集、推送或定时任务。
name: Market Data Live Smoke Test

on:
  workflow_dispatch:
    inputs:
      security_codes:
        description: "逗号分隔的六位A股证券代码"
        required: true
        default: "600000,000001,600519,000858,300750"

permissions:
  contents: read

jobs:
  eastmoney-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/market-opportunity-radar-v1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install smoke-test dependency
        run: python -m pip install "requests>=2.32.5,<3.0.0"
      - name: Query a small quote sample
        run: |
          python scripts/market_data/live_quote_smoke.py --codes "${{ inputs.security_codes }}"
