# 本工作流仅在市场数据相关文件的Pull Request变更时运行单元与SQLite集成测试，不触发新闻采集或定时任务。
name: Market Data Tests

on:
  pull_request:
    paths:
      - "trendradar/market_data/**"
      - "trendradar/storage/market_schema.sql"
      - "trendradar/__init__.py"
      - "tests/market_data/**"
      - ".github/workflows/market-data-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-data-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install market-data test dependency
        run: python -m pip install "requests>=2.32.5,<3.0.0"
      - name: Run market data tests
        run: python -m unittest discover -s tests/market_data -v
